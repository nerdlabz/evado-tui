[tools]
go = "1.25"
golangci-lint = "2.14.0"
gofumpt = "0.12.0"

[env]
CGO_ENABLED = "0"

[tasks.build]
description = "Build the evado TUI for the host platform"
run = """
version=${EVADO_BUILD_VERSION:-$(git describe --tags --always --dirty 2>/dev/null || echo dev)}
go build -trimpath -buildvcs=false -ldflags "-s -w -X main.version=$version" -o dist/evado ./cmd/evado
"""

[tasks.build-all]
description = "Cross-compile release binaries for every supported platform"
run = """
set -eu
version=${EVADO_BUILD_VERSION:-$(git describe --tags --always --dirty 2>/dev/null || echo dev)}
targets="darwin/arm64 darwin/amd64 linux/amd64 linux/arm64 linux/arm windows/amd64 windows/arm64"
for t in $targets; do
  os=$(echo "$t" | cut -d/ -f1)
  arch=$(echo "$t" | cut -d/ -f2)
  name="dist/evado_${os}_${arch}"
  if [ "$os" = "windows" ]; then name="${name}.exe"; fi
  echo "building $name"
  CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build -trimpath -buildvcs=false -ldflags "-s -w -X main.version=$version" -o "$name" ./cmd/evado
done
echo "done: $(ls dist | wc -l | tr -d ' ') binaries"
"""

[tasks.test]
description = "Run the test suite"
run = "go test ./..."

# The race detector needs cgo, which the global CGO_ENABLED=0 (kept for
# static release builds) turns off.
[tasks.test-race]
description = "Run the test suite under the race detector"
env = { CGO_ENABLED = "1" }
run = "go test -race ./..."

[tasks.check]
description = "Format check, vet, and lint"
run = ['test -z "$(gofumpt -l .)"', "go vet ./...", "golangci-lint run"]

# Which runners CI and releases use. See "Runners" in docs/releasing.md.
[tasks."ci:runners"]
description = "Show which runners CI uses"
run = """
if [ "$(gh variable get CI_RUNNERS -R nerdlabz/evado-tui 2>/dev/null)" = github ]; then
  echo "CI runs on GitHub-hosted runners. Switch back with: mise run ci:blacksmith"
else
  echo "CI runs on Blacksmith, with macOS and pull requests from forks on GitHub. Switch with: mise run ci:github"
fi
"""

[tasks."ci:github"]
description = "Run all of CI and releases on GitHub-hosted runners"
run = """
gh variable set CI_RUNNERS -R nerdlabz/evado-tui --body github
echo "New runs use GitHub-hosted runners. Re-run a queued or failed run to move it."
"""

[tasks."ci:blacksmith"]
description = "Run CI and releases on Blacksmith again"
run = """
gh variable delete CI_RUNNERS -R nerdlabz/evado-tui 2>/dev/null || true
echo "New runs use Blacksmith. Re-run a queued or failed run to move it."
"""
