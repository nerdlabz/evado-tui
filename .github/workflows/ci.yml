name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Linux and Windows run on Blacksmith's smallest runners. macOS runs on
# GitHub's, where it is as fast and costs far less.
#
# Pull requests from forks always use GitHub-hosted runners, which are free
# for a public repository and keep code from outside the project off paid
# machines. Setting the repository variable CI_RUNNERS to "github" moves
# every job there, for when Blacksmith's minutes run out:
#
#   mise run ci:github       # and mise run ci:blacksmith to go back
#
# Both sides use the same OS versions, so a change that passes on one passes
# on the other.
jobs:
  check:
    runs-on: ${{ (github.event.pull_request.head.repo.fork || vars.CI_RUNNERS == 'github') && 'ubuntu-24.04' || 'blacksmith-2vcpu-ubuntu-2404' }}
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
        with:
          cache: false
      - run: mise run check
      - run: mise run test
      - run: mise run test-race

  platform-tests:
    name: platform-tests (${{ matrix.name }})
    strategy:
      matrix:
        include:
          - name: linux-arm64
            github: ubuntu-24.04-arm
            blacksmith: blacksmith-2vcpu-ubuntu-2404-arm
          - name: macos
            github: macos-26
            blacksmith: macos-26
          - name: windows
            github: windows-2025
            blacksmith: blacksmith-2vcpu-windows-2025
    runs-on: ${{ (github.event.pull_request.head.repo.fork || vars.CI_RUNNERS == 'github') && matrix.github || matrix.blacksmith }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - run: go test ./...

  # A tag is the first time the release workflow runs, so what it does to the
  # source is proved here first: every target compiles, and the packager
  # turns the binaries into archives, a formula and a Nix manifest that its
  # own checksums agree with. Nothing is uploaded.
  package:
    runs-on: ${{ (github.event.pull_request.head.repo.fork || vars.CI_RUNNERS == 'github') && 'ubuntu-24.04' || 'blacksmith-2vcpu-ubuntu-2404' }}
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
        with:
          cache: false
      - name: Build every release target
        run: EVADO_BUILD_VERSION="$(cat VERSION)" mise run build-all
      - name: Package them as a release would
        run: |
          version=$(cat VERSION)
          mise exec -- python3 scripts/third-party-notices.py > dist/THIRD_PARTY_NOTICES.txt
          python3 scripts/package-release.py "$version" \
            --repository "$GITHUB_REPOSITORY" \
            --notices dist/THIRD_PARTY_NOTICES.txt --output dist/release
          (cd dist/release && sha256sum --check SHA256SUMS)
          ruby -c dist/release/evado.rb
          got=$(./dist/evado_linux_amd64 -version)
          if [[ "$got" != "evado $version" ]]; then
            echo "Built binary reports '$got', expected 'evado $version'" >&2
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: nix-release-manifest
          path: dist/release/release.json
          if-no-files-found: error
          retention-days: 1

  # The source flake pins the Go modules by hash and runs the tests in Nix's
  # sandbox, and the binary flake reads a release's manifest. Neither is
  # built by anything else, so a stale hash would first show to someone
  # installing with Nix. Nix runs on a GitHub-hosted runner on both sides.
  nix:
    needs: package
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - name: Build from source
        run: |
          nix build .#evado --print-build-logs
          got=$(./result/bin/evado -version)
          if [[ "$got" != "evado $(cat VERSION)" ]]; then
            echo "Nix build reports '$got', expected 'evado $(cat VERSION)'" >&2
            exit 1
          fi
      - uses: actions/download-artifact@v4
        with:
          name: nix-release-manifest
          path: packaging/nix
      - name: Evaluate the binary flake with this build's manifest
        run: nix eval --raw "path:$PWD/packaging/nix#evado.name"
