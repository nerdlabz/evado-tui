name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Linux and Windows run on Blacksmith's smallest runners. macOS runs on
# GitHub's, where it is as fast and costs far less.
#
# Pull requests from forks always use GitHub-hosted runners, which are free
# for a public repository and keep code from outside the project off paid
# machines. Setting the repository variable CI_RUNNERS to "github" moves
# every job there, for when Blacksmith's minutes run out:
#
#   gh variable set CI_RUNNERS --body github     # and --body blacksmith to go back
#
# Both sides use the same OS versions, so a change that passes on one passes
# on the other.
jobs:
  check:
    runs-on: ${{ (github.event.pull_request.head.repo.fork || vars.CI_RUNNERS == 'github') && 'ubuntu-24.04' || 'blacksmith-2vcpu-ubuntu-2404' }}
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
        with:
          cache: false
      - run: mise run check
      - run: mise run test
      - run: mise run test-race

  platform-tests:
    name: platform-tests (${{ matrix.name }})
    strategy:
      matrix:
        include:
          - name: linux-arm64
            github: ubuntu-24.04-arm
            blacksmith: blacksmith-2vcpu-ubuntu-2404-arm
          - name: macos
            github: macos-26
            blacksmith: macos-26
          - name: windows
            github: windows-2025
            blacksmith: blacksmith-2vcpu-windows-2025
    runs-on: ${{ (github.event.pull_request.head.repo.fork || vars.CI_RUNNERS == 'github') && matrix.github || matrix.blacksmith }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - run: go test ./...
