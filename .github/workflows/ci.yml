name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Pull requests from forks run on GitHub-hosted runners, which are free for a
# public repository and keep code from outside the project off paid machines.
# Everything else runs on Blacksmith. Both sides use the same OS versions, so a
# change that passes on one passes on the other.
jobs:
  check:
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-24.04' || 'blacksmith-4vcpu-ubuntu-2404' }}
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
        with:
          cache: false
      - run: mise run check
      - run: mise run test
      - run: mise run test-race

  platform-tests:
    name: platform-tests (${{ matrix.name }})
    strategy:
      matrix:
        include:
          - name: macos
            github: macos-26
            blacksmith: blacksmith-6vcpu-macos-26
          - name: windows
            github: windows-2025
            blacksmith: blacksmith-4vcpu-windows-2025
    runs-on: ${{ github.event.pull_request.head.repo.fork && matrix.github || matrix.blacksmith }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - run: go test ./...
